minimumReleaseAgeExclude:
  - "@hookform/resolvers@7.0.1"
  - react-resizable-panels@4.16.1

# With "packageManager" set, pnpm 12 otherwise writes an env document first in
# pnpm-lock.yaml; GitHub's dependency graph reads only that first document and
# Dependabot then sees no dependencies at all (pnpm/pnpm#13805).
pmOnFail: ignore

overrides:
  minimatch@>=10 <11.0.1: ^11.0.1 # GHSA-g3hv-75wg-m249; the 3.x copy stays (no 3.x fix, and 11 is not callable the 3.x way), see osv-scanner.toml

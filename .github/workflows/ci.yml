name: CI

# Gates every pull request, Dependabot's included: no paths filter and no
# bot-actor skip, so a dependency bump always runs the full check.
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, design-lint, eslint
        run: pnpm check
      - run: pnpm build
      - name: Render smoke test (1440/390px, light/dark)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm start &
          for _ in $(seq 30); do curl -sf http://localhost:3000 > /dev/null && break; sleep 1; done
          pnpm shot /
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: .screenshots/
          if-no-files-found: ignore

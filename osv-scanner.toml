[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
reason = "minimatch@3.1.5 has no compatible reachable patch as of 2026-11-02, and it does not contain the code the advisory describes. The advisory names firstPhasePreProcess() under optimizationLevel >= 2; neither name occurs in minimatch@3.1.5's minimatch.js, while minimatch@11.0.3 has both. The 3.x consumers in pnpm-lock.yaml are eslint-plugin-import 2.32.0, eslint-plugin-jsx-a11y 6.10.2 and eslint-plugin-react 7.37.5, each the latest release and each requiring ^3.1.2. Under an override to ^11.0.3, enabling import/no-extraneous-dependencies or react/jsx-pascal-case makes ESLint throw TypeError (minimatch is not a function), and both pass without the override. Reachability evidence: `pnpm exec eslint --print-config app/page.tsx` enables none of the plugin rules that call minimatch, and those rules take their patterns from this repository's ESLint config, not from input. The only 10.x consumer, eslint 10.14.0 (^10.2.6), is overridden to ^11.0.1 in pnpm-workspace.yaml. Dependabot alert #1 was dismissed as tolerable risk on the same evidence. Approved by Dongmin Yu (AndrewDongminYoo) on 2026-11-02. Re-evaluation owner: AndrewDongminYoo checks when these plugins move to minimatch 11 or a 3.x fix is released."

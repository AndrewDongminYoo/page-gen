reason = "minimatch@3.1.5 has no compatible reachable patch as of 2026-11-01: the advisory affects every version below 11.0.1, and minimatch 11's CommonJS export is not callable the way its 3.x consumers call it (eslint-plugin-import 2.32.0, eslint-plugin-jsx-a11y 6.10.2 and eslint-plugin-react 7.37.5 threw TypeError under an override to 11.0.3). Reachability evidence: these plugins load minimatch only at lint time with glob patterns from this repository's own ESLint config, and `pnpm exec eslint --print-config src/app/page.tsx` showed no enabled rule that calls minimatch. The 10.x consumers are overridden to ^11.0.1 in pnpm-workspace.yaml. Approved by Dongmin Yu (AndrewDongminYoo) on 2026-11-01 in PR #21. Re-evaluation owner: AndrewDongminYoo checks when these plugins move to minimatch 11 or a 3.x fix is released."
